fail_fast: true
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: update-flake-lock
        name: Update flake lock
        entry: bash scripts/nix-hook.sh update
        language: system
        pass_filenames: false
        always_run: true
      - id: check-flake
        name: Check flake configuration
        entry: bash scripts/nix-hook.sh check
        language: system
        pass_filenames: false
        always_run: true
      - id: build-darwin
        name: Build Darwin configuration
        entry: bash scripts/nix-hook.sh build
        language: system
        pass_filenames: false
        always_run: true
      - id: switch-darwin
        name: Apply Darwin configuration when relevant
        entry: bash scripts/apply-mac-on-push.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
